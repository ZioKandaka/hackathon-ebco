steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --build-arg
      - VITE_API_BASE_URL=${_API_BASE_URL}
      - --build-arg
      - VITE_GOOGLE_MAPS_API_KEY=${_MAPS_KEY}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  substitutionOption: ALLOW_LOOSE
